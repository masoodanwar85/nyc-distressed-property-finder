<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}NYC Leads{% endblock %}</title>
<style>
  :root { --ink:#1c2430; --muted:#667085; --line:#e2e6ec; --bg:#f6f7f9; --accent:#0b5cad; --good:#12733d; --warn:#a15c00; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; gap:24px; align-items:center; }
  header strong { font-size:16px; }
  header nav { display:flex; gap:16px; flex:1; }
  header form { margin:0; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  main { max-width:1280px; margin:0 auto; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:16px; margin:24px 0 8px; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; }
  .filters { display:flex; flex-wrap:wrap; gap:12px; align-items:end; margin:16px 0; }
  .filters label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  input, select, textarea, button { font:inherit; padding:7px 10px; border:1px solid #c9ced6; border-radius:6px; background:#fff; }
  button, .button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; padding:7px 14px; border-radius:6px; display:inline-block; }
  .button.secondary, button.secondary { background:#fff; color:var(--accent); }
  .table-wrap { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
  td.wrap { white-space:normal; min-width:220px; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:#fafbfc; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
  .tag.good { color:var(--good); border-color:#b7dfc6; background:#eef8f1; }
  .tag.warn { color:var(--warn); border-color:#f0d9a8; background:#fdf6e7; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:6px 16px; margin:0; } dt { color:var(--muted); } dd { margin:0; }
  .pager { display:flex; gap:12px; align-items:center; margin-top:16px; }
  ul.plain { margin:0; padding-left:18px; }
  .error { color:#b42318; }
</style>
</head>
<body>
<header>
  <strong>NYC Distressed Property Finder</strong>
  <nav>
    {% if user.is_authenticated %}
    <a href="{% url 'lead_list' %}">Leads</a>
    <a href="{% url 'run_list' %}">Run history</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
    {% endif %}
  </nav>
  {% if user.is_authenticated %}
  <form method="post" action="{% url 'logout' %}">{% csrf_token %}<span class="muted small">{{ user.username }}</span> <button class="secondary">Log out</button></form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
