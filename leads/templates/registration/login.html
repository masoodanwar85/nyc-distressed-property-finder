{% extends "leads/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:48px auto">
  <h1>Log in</h1>
  {% if form.errors %}<p class="error">Username or password is incorrect.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label>Username<br>{{ form.username }}</label></p>
    <p><label>Password<br>{{ form.password }}</label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button>Log in</button>
  </form>
</div>
{% endblock %}
